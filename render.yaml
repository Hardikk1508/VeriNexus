services:
  - type: web
    name: verinexus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: TAVILY_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: verinexus
      # Paste the Firebase service account JSON as one line (base64-encode
      # it if the dashboard's text box mangles the raw JSON's newlines).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # "llm" instead of "local": Render's free tier (512MB RAM) can't reliably
      # hold torch + the DeBERTa NLI model in memory alongside everything else.
      # Switch to "local" if you upgrade to a paid instance type later.
      - key: NLI_BACKEND
        value: llm
      - key: CORS_ORIGINS
        value: '["https://veri-nexus.vercel.app","http://localhost:5173"]'
